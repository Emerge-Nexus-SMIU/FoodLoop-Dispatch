name: Verify FoodLoop
on: [push, pull_request]
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: foodloop
          POSTGRES_PASSWORD: foodloop_local
          POSTGRES_DB: foodloop
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U foodloop -d foodloop"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://foodloop:foodloop_local@localhost:5432/foodloop
      APP_ORIGIN: http://localhost:3000
      ALLOW_DEMO_SEED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run dev:configure
      - run: npm run db:generate && npm run db:migrate && npm run db:seed
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run format:check && npm run lint && npm run typecheck
      - run: npm test && npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            test-results/
            docs/screenshots/
